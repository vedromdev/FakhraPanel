services:
  panel:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    volumes:
      - ./data:/app/data
    command: node backend/src/index.js

  agent-berlin:
    build:
      context: .
      dockerfile: backend/Dockerfile.agent
    env_file: .env.agent.example
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [panel]
    profiles: ["dev"]
